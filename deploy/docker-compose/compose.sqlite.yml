services:
  api:
    image: ${XDP_FIREWALL_IMAGE:-xdp-firewall:0.1.26}
    environment:
      DATABASE_URL: sqlite:///var/lib/xdp-firewall/xdp-firewall.db?mode=rwc
      XDP_FIREWALL_API_TOKEN: ${XDP_FIREWALL_API_TOKEN:?set XDP_FIREWALL_API_TOKEN to enable API authentication}
      XDP_FIREWALL_AGENT_TOKEN: ${XDP_FIREWALL_AGENT_TOKEN:?set XDP_FIREWALL_AGENT_TOKEN to authenticate agents}
      XDP_FIREWALL_TRUSTED_CIDRS: ${XDP_FIREWALL_TRUSTED_CIDRS:-}
      XDP_FIREWALL_XDS_PUSH_INTERVAL_SECONDS: ${XDP_FIREWALL_XDS_PUSH_INTERVAL_SECONDS:-5}
      RUST_LOG: ${RUST_LOG:-xdp_firewall=info}
    volumes:
      - ./sqlite-data:/var/lib/xdp-firewall
    ports:
      - "${XDP_FIREWALL_API_PORT:-8080}:8080"
      - "${XDP_FIREWALL_XDS_PORT:-50051}:50051"
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://127.0.0.1:8080/health || curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  agent:
    image: ${XDP_FIREWALL_IMAGE:-xdp-firewall:0.1.26}
    depends_on:
      api:
        condition: service_healthy
    network_mode: host
    uts: host
    privileged: true
    pid: host
    environment:
      XDP_FIREWALL_XDS_URL: ${XDP_FIREWALL_XDS_URL:-http://127.0.0.1:50051}
      XDP_FIREWALL_AGENT_TOKEN: ${XDP_FIREWALL_AGENT_TOKEN:?set XDP_FIREWALL_AGENT_TOKEN to authenticate agents}
      XDP_FIREWALL_AGENT_ONLY: "true"
      XDP_FIREWALL_XDP_MODE: ${XDP_FIREWALL_XDP_MODE:-auto}
      XDP_FIREWALL_XDP_ATTACH_STRATEGY: ${XDP_FIREWALL_XDP_ATTACH_STRATEGY:-direct}
      XDP_FIREWALL_XDP_ALLOW_REPLACE: ${XDP_FIREWALL_XDP_ALLOW_REPLACE:-false}
      XDP_FIREWALL_XDP_RUN_PRIORITY: ${XDP_FIREWALL_XDP_RUN_PRIORITY:-10}
      RUST_LOG: ${RUST_LOG:-xdp_firewall=info}
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
    command:
      - agent
    restart: unless-stopped
