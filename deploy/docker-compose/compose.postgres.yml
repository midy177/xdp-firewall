services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xdp_firewall
      POSTGRES_USER: xdp_firewall
      POSTGRES_PASSWORD: xdp_firewall
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xdp_firewall -d xdp_firewall"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${XDP_FIREWALL_IMAGE:-1228022817/xdp-firewall:0.1.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://xdp_firewall:xdp_firewall@postgres:5432/xdp_firewall
      XDP_FIREWALL_API_TOKEN: ${XDP_FIREWALL_API_TOKEN:?set XDP_FIREWALL_API_TOKEN to enable API authentication}
      XDP_FIREWALL_AGENT_TOKEN: ${XDP_FIREWALL_AGENT_TOKEN:?set XDP_FIREWALL_AGENT_TOKEN to authenticate agents}
      XDP_FIREWALL_TRUSTED_CIDRS: ${XDP_FIREWALL_TRUSTED_CIDRS:-}
      XDP_FIREWALL_XDS_PUSH_INTERVAL_SECONDS: ${XDP_FIREWALL_XDS_PUSH_INTERVAL_SECONDS:-5}
      RUST_LOG: ${RUST_LOG:-xdp_firewall=info}
    ports:
      - "${XDP_FIREWALL_API_PORT:-8080}:8080"
      - "${XDP_FIREWALL_XDS_PORT:-50051}:50051"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  agent:
    image: ${XDP_FIREWALL_IMAGE:-1228022817/xdp-firewall:0.1.0}
    network_mode: host
    uts: host
    privileged: true
    pid: host
    environment:
      XDP_FIREWALL_XDS_URL: ${XDP_FIREWALL_XDS_URL:-http://127.0.0.1:50051}
      XDP_FIREWALL_AGENT_TOKEN: ${XDP_FIREWALL_AGENT_TOKEN:?set XDP_FIREWALL_AGENT_TOKEN to authenticate agents}
      XDP_FIREWALL_AGENT_ONLY: "true"
      XDP_FIREWALL_XDP_MODE: ${XDP_FIREWALL_XDP_MODE:-auto}
      RUST_LOG: ${RUST_LOG:-xdp_firewall=info}
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
    command:
      - agent
    restart: unless-stopped

volumes:
  postgres-data:
