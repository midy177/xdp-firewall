services:
  agent:
    image: ${XDP_FIREWALL_IMAGE:-1228022817/xdp-firewall:0.1.0}
    network_mode: host
    uts: host
    privileged: true
    pid: host
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to postgres://, mysql://, or sqlite://}
      XDP_FIREWALL_XDP_MODE: ${XDP_FIREWALL_XDP_MODE:-auto}
      RUST_LOG: ${RUST_LOG:-xdp_firewall=info}
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
    command:
      - agent
    restart: unless-stopped
