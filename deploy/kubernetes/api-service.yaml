apiVersion: v1
kind: Service
metadata:
  name: xdp-firewall-api
  namespace: xdp-firewall
  labels:
    app.kubernetes.io/name: xdp-firewall
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: xdp-firewall
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 50051
      targetPort: grpc
