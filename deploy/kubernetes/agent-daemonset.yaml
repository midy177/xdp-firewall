apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: xdp-firewall-agent
  namespace: xdp-firewall
  labels:
    app.kubernetes.io/name: xdp-firewall
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: xdp-firewall
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xdp-firewall
        app.kubernetes.io/component: agent
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: xdp-firewall:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - BPF
                - PERFMON
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: xdp-firewall-db
                  key: database_url
            - name: XDP_FIREWALL_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: XDP_FIREWALL_XDP_MODE
              value: auto
            - name: RUST_LOG
              value: xdp_firewall=info
          command: ["/usr/local/bin/xdp-firewall"]
          args:
            - agent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: modules
          hostPath:
            path: /lib/modules
            type: DirectoryOrCreate
