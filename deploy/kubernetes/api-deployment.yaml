apiVersion: apps/v1
kind: Deployment
metadata:
  name: xdp-firewall-api
  namespace: xdp-firewall
  labels:
    app.kubernetes.io/name: xdp-firewall
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: xdp-firewall
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xdp-firewall
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: xdp-firewall:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: xdp-firewall-db
                  key: database_url
            - name: XDP_FIREWALL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: xdp-firewall-db
                  key: api_token
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
