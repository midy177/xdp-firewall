services:
  btmp-monitor:
    image: ${BTMP_MONITOR_IMAGE:-btmp-monitor:0.1.0}
    network_mode: host
    environment:
      XDP_FIREWALL_API_TOKEN: ${XDP_FIREWALL_API_TOKEN:?set XDP_FIREWALL_API_TOKEN to authenticate against the xdp-firewall API}
      BTMP_MONITOR_API_URL: ${BTMP_MONITOR_API_URL:-http://127.0.0.1:8080}
      BTMP_MONITOR_THRESHOLD: ${BTMP_MONITOR_THRESHOLD:-5}
      BTMP_MONITOR_WINDOW_SECONDS: ${BTMP_MONITOR_WINDOW_SECONDS:-86400}
      BTMP_MONITOR_DURATION_SECONDS: ${BTMP_MONITOR_DURATION_SECONDS:-600}
      BTMP_MONITOR_PROTOCOL: ${BTMP_MONITOR_PROTOCOL:-any}
      BTMP_MONITOR_PORT: ${BTMP_MONITOR_PORT:-0}
      BTMP_MONITOR_BTMP_PATH: ${BTMP_MONITOR_BTMP_PATH:-/var/log/btmp}
      BTMP_MONITOR_TRUSTED_CIDRS: ${BTMP_MONITOR_TRUSTED_CIDRS:-127.0.0.0/8,::1/128}
      BTMP_MONITOR_INTERVAL: ${BTMP_MONITOR_INTERVAL:-60}
      RUST_LOG: ${RUST_LOG:-btmp_monitor=info}
    volumes:
      # Mount the whole /var/log read-only instead of the single btmp file:
      # a single-file bind mount pins the old inode, so after logrotate
      # rotates btmp the container would keep reading the stale file forever.
      - /var/log:/var/log:ro
    # The tool only reads btmp and talks to the API; keep the rootfs read-only.
    read_only: true
    restart: unless-stopped
